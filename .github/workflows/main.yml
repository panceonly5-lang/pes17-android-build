
name: PES17 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prepare Android ARM64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose private release access
        env:
          PPC_TOKEN: ${{ secrets.PPC_DOWNLOAD_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PPC_TOKEN" ]; then
            echo "ERROR: PPC_DOWNLOAD_TOKEN is empty or unavailable."
            exit 1
          fi

          echo "PPC_DOWNLOAD_TOKEN is present."

          GH_TOKEN="$PPC_TOKEN" gh repo view \
            panceonly5-lang/pes17-private-build- \
            --json nameWithOwner,isPrivate

          echo "=== LIST RELEASES ==="
          GH_TOKEN="$PPC_TOKEN" gh release list \
            --repo panceonly5-lang/pes17-private-build- \
            --limit 20

          echo "=== CHECK PPC-V1 ==="
          GH_TOKEN="$PPC_TOKEN" gh release view ppc-v1 \
            --repo panceonly5-lang/pes17-private-build- \
            --json tagName,name,isDraft,assets
            
      - name: Download PPC recompilation archive
        env:
          GH_TOKEN: ${{ secrets.PPC_DOWNLOAD_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ppc-recomp-download"
          mkdir -p "$RUNNER_TEMP/ppc-recomp-extracted"

          gh release download ppc-v1 \
            --repo panceonly5-lang/pes17-private-build- \
            --pattern "ppc-recomp.tar.gz" \
            --dir "$RUNNER_TEMP/ppc-recomp-download"

          echo "=== DOWNLOAD VERIFICATION ==="
          ls -lh "$RUNNER_TEMP/ppc-recomp-download/"

          echo "=== ARCHIVE CONTENTS ==="
          tar -tzf "$RUNNER_TEMP/ppc-recomp-download/ppc-recomp.tar.gz" \
            > "$RUNNER_TEMP/ppc-files.txt"

          sed -n '1,40p' "$RUNNER_TEMP/ppc-files.txt"

          echo "=== EXTRACTING PPC ==="
          tar -xzf "$RUNNER_TEMP/ppc-recomp-download/ppc-recomp.tar.gz" \
            -C "$RUNNER_TEMP/ppc-recomp-extracted"

          echo "=== EXTRACTED FILES ==="
          find "$RUNNER_TEMP/ppc-recomp-extracted" \
            -maxdepth 3 -type f | head -40

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang python3 git unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses \
            || sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android NDK r26 and platform
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -e
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          echo "Android NDK r26 is installed."

      - name: Check project files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== CHECK REQUIRED FILES ==="
          if [ -f CMakeLists.txt ]; then
            echo "FOUND: CMakeLists.txt"
          else
            echo "MISSING: CMakeLists.txt"
          fi

          if [ -f build.sh ]; then
            echo "FOUND: build.sh"
          else
            echo "MISSING: build.sh"
          fi

      - name: Report build configuration
        run: |
          echo "Target ABI: arm64-v8a"
          echo "Target Android API: 26"
          echo "NDK revision: $ANDROID_NDK_VERSION"
          echo "Environment preparation completed."
