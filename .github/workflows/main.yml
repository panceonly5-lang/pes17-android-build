
name: PES17 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prepare Android NDK r26
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3 git unzip

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android platform and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android NDK
        run: |
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
          "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Check project files
        run: |
          test -f CMakeLists.txt
          test -f build.sh
          echo "Project files found."
