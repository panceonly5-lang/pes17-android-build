name: PES17 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PES 2017 Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 28.2.13676358
      PES17_NATIVE_OPTIMISATION: "-O2"
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          java -version
          cmake --version

      - name: Download private PPC sources
        env:
          PPC_TOKEN: ${{ secrets.PES_DOWNLOAD_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PPC_TOKEN" ]; then
            echo "PES_DOWNLOAD_TOKEN is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ppc-download"
          mkdir -p "$RUNNER_TEMP/ppc-extracted"

          GH_TOKEN="$PPC_TOKEN" gh release download ppc-v1 \
            --repo panceonly5-lang/pes17-private-build- \
            --pattern "ppc-recomp.tar.gz" \
            --dir "$RUNNER_TEMP/ppc-download"

          test -s "$RUNNER_TEMP/ppc-download/ppc-recomp.tar.gz"

          tar -xzf "$RUNNER_TEMP/ppc-download/ppc-recomp.tar.gz" \
            -C "$RUNNER_TEMP/ppc-extracted"

          test -d "$RUNNER_TEMP/ppc-extracted/ppc"

          mkdir -p ppc
          cp -a "$RUNNER_TEMP/ppc-extracted/ppc/." ppc/

          COUNT=$(find ppc -maxdepth 1 -name 'ppc_recomp.*.cpp' | wc -l)
          echo "PPC C++ source files: $COUNT"

          test "$COUNT" -gt 1000
          test -s ppc/ppc_config.h
          test -s ppc/ppc_context.h
          test -s ppc/ppc_recomp_shared.h
          test -s ppc/ppc_func_mapping.cpp

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          bash ./gradlew \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES17-Android-ARM64-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build diagnostics
        if: failure()
        run: |
          echo "=== Gradle output files ==="
          find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null | head -100 || true
          echo "=== Native build logs ==="
          find android/app/.cxx -type f \( -name "*.log" -o -name "*.txt" \) 2>/dev/null | head -50 || true
