
name: PES17 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prepare Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang python3 git unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Check project files
        run: |
          test -f CMakeLists.txt
          test -f build.sh
          echo "Project files found."

      - name: Report environment
        run: |
          echo "Android NDK r26 ready"
          echo "Target ABI: arm64-v8a"
          echo "Target Android API: 26"
          echo "Environment preparation successful"
